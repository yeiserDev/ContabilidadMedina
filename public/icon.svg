<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Conta Medina — barras ascendentes acunadas por un trazo que sale
       disparado hacia arriba. Misma geometría que la marca del splash
       (index.html, .sp-mark), sólo que aquí sobre la baldosa crema, para que
       el icono, el favicon y la cabecera sean el mismo dibujo.
       Va en coordenadas 130x100 dentro de un <svg> anidado: así la marca se
       escala y se centra sola sin recalcular cada punto. -->
  <defs>
    <linearGradient id="baldosa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF5EE"/>
      <stop offset="1" stop-color="#F5E4D5"/>
    </linearGradient>
    <!-- Las barras van de marrón quemado (arriba) a naranja (abajo). -->
    <linearGradient id="barra" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#7A3413"/>
      <stop offset="0.55" stop-color="#C4470E"/>
      <stop offset="1"    stop-color="#F0873F"/>
    </linearGradient>
    <!-- El trazo es más luminoso que las barras: es lo que da el brillo. -->
    <linearGradient id="trazo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#B93C05"/>
      <stop offset="0.55" stop-color="#E2691F"/>
      <stop offset="1"    stop-color="#F9A45C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#baldosa)"/>

  <svg x="86" y="126" width="340" height="262" viewBox="0 0 130 100">
    <g fill="url(#barra)">
      <rect x="28" y="44" width="16" height="38" rx="5"/>
      <rect x="50" y="30" width="16" height="52" rx="5"/>
      <rect x="72" y="14" width="16" height="68" rx="5"/>
    </g>
    <path d="M4 56 C12 98 66 108 100 62" fill="none" stroke="url(#trazo)" stroke-width="13" stroke-linecap="round"/>
    <!-- La punta no es un triángulo simple: el lomo va recto y el filo vuelve
         algo hundido, que es lo que le da el gesto de latigazo. -->
    <path d="M107 68 L93 55 L126 22 L118 46 Z" fill="url(#trazo)"/>
  </svg>
</svg>
