<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Conta Medina — monograma CM.
       Vectorización del logo: C en bronce, M en oro y barras ascendentes
       (crecimiento) alojadas dentro de la C. El original es un render 3D con
       textura e iluminación; aquí se reconstruye la geometría para que escale
       limpio de 512px a 16px y pese unos pocos KB. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241D"/>
      <stop offset="1" stop-color="#131210"/>
    </linearGradient>
    <linearGradient id="bronce" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#6E5730"/>
      <stop offset="1" stop-color="#B99A57"/>
    </linearGradient>
    <linearGradient id="oro" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0"   stop-color="#A8781F"/>
      <stop offset="0.5" stop-color="#E0B44A"/>
      <stop offset="1"   stop-color="#F7E3A1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#tile)"/>

  <!-- C -->
  <path d="M 330.5 133.7 A 156 156 0 1 0 330.5 378.3"
        fill="none" stroke="url(#bronce)" stroke-width="46" stroke-linecap="butt"/>

  <!-- Barras ascendentes -->
  <g fill="url(#oro)">
    <rect x="192" y="316" width="19" height="60"  rx="3"/>
    <rect x="222" y="292" width="19" height="84"  rx="3"/>
    <rect x="252" y="268" width="19" height="108" rx="3"/>
  </g>

  <!-- M. Se dibuja dos veces: primero un trazo más ancho del color del fondo,
       que abre un canal donde la M cruza la C y hace que se lea por delante de
       ella, como en el logo original. Luego el trazo dorado.

       stroke-miterlimit=3 es deliberado: en las puntas de arriba el ángulo es
       tan agudo que el miter se dispararía en pinchos, así que ahí cae a bisel
       (corte plano, igual que el original). El vértice del valle es más abierto,
       queda por debajo del límite y conserva la punta afilada. -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="3">
    <polyline points="298,398 298,150 368,300 438,150 438,398"
              stroke="#131210" stroke-width="61"/>
    <polyline points="298,398 298,150 368,300 438,150 438,398"
              stroke="url(#oro)" stroke-width="43"/>
  </g>
</svg>
